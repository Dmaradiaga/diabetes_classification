stages:
  data_extraction:
    cmd: python3 src/data/extract_data.py
    deps:
    - src/data/extract_data.py
    outs:
    - data/raw

  processed-data:
    cmd: python3 src/data/transform_data.py
    deps:
    - data/raw/test.parquet
    - data/raw/train.parquet
    - src/data/transform_data.py
    outs:
    - data/processed-data
  train_model:
    cmd: python3 src/models/train_model.py
    deps:
    - data/processed-data/test.parquet
    - data/processed-data/train.parquet
    - src/models/train_model.py
    outs:
    - models/bosque_aleatorio.pkl
