data_extraction:
  test_size: 0.2
  random_state: 42

pca:
  n_components: 0.95

train_model:
  n_iter: 20
  cv: 5
  random_state: 42
  param_distributions:
    classifier__n_estimators: [50, 100, 200, 300]
    classifier__max_depth: [null, 10, 20, 30]
    classifier__min_samples_split: [2, 5, 10]
    classifier__min_samples_leaf: [1, 2, 4]
    classifier__bootstrap: [true, false]
    
mlflow:
  model_name: "bosque_aleatorio_final"
  experiment_name: "Diabetes_clasificacion_Final"
  stage: "Staging"
